<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insider Sentinel — Login</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dark-mode.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Dark Mode Toggle -->
    <button class="login-dark-toggle" data-toggle-dark title="Toggle dark mode">
      <span class="dark-mode-icon">🌙</span>
    </button>

    <div class="login-page">
      <div class="login-card">
        <!-- Logo -->
        <div class="login-logo">
          <div class="login-logo-icon">🛡️</div>
          <div>
            <div class="login-logo-text">Insider Sentinel</div>
            <div class="login-logo-sub">Behavioral Risk Analysis System</div>
          </div>
        </div>

        <!-- Role Selector -->
        <div class="login-role-selector">
          <button
            class="role-btn selected"
            id="btnAdmin"
            onclick="selectRole('admin')"
          >
            <span class="role-icon">🔐</span>
            Login as Admin
          </button>
          <button
            class="role-btn"
            id="btnEmployee"
            onclick="selectRole('employee')"
          >
            <span class="role-icon">👤</span>
            Login as Employee
          </button>
        </div>

        <!-- Error message -->
        <div
          id="loginError"
          class="alert alert-danger"
          style="display: none"
        ></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="name@insider.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-block btn-lg"
            id="loginBtn"
          >
            Sign In
          </button>
        </form>

        <!-- Demo Credentials -->
        <!-- <div class="login-demo-creds">
        <strong>Demo credentials:</strong><br>
        Admin:    admin1@insider.com / Secure@123<br>
        Employee: emp1@company.com / Secure@123
      </div> -->
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
      let selectedRole = "admin";

      function selectRole(role) {
        selectedRole = role;
        document
          .getElementById("btnAdmin")
          .classList.toggle("selected", role === "admin");
        document
          .getElementById("btnEmployee")
          .classList.toggle("selected", role === "employee");

        // Pre-fill demo creds for convenience
        // const demos = {
        //   admin: { email: "admin1@insider.com", pw: "Secure@123" },
        //   employee: { email: "emp1@company.com", pw: "Secure@123" },
        // };
        // document.getElementById("email").value = demos[role].email;
        // document.getElementById("password").value = demos[role].pw;
      }

      async function handleLogin(e) {
        e.preventDefault();
        const errEl = document.getElementById("loginError");
        const btn = document.getElementById("loginBtn");
        errEl.style.display = "none";
        btn.disabled = true;
        btn.textContent = "Signing in…";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const res = await API.post("/auth/login", { email, password });
        btn.disabled = false;
        btn.textContent = "Sign In";

        if (!res || !res.ok) {
          errEl.textContent =
            res?.data?.error || "Login failed. Please try again.";
          errEl.style.display = "flex";
          return;
        }

        Auth.save(res.data.data);
        const role = res.data.data.role;
        window.location.href = role === "admin" ? "/admin" : "/employee";
      }

      // Pre-fill admin role on load
      selectRole("admin");
    </script>
  </body>
</html>
